<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Gift Fund: ₹2,000</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e1b4b, var(--bg));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      max-width: 400px;
      width: 100%;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
    p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; line-height: 1.4; }
    .amount-pill {
      font-size: 2rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 1.5rem;
    }
    .qr-container {
      background: #ffffff;
      padding: 1rem;
      border-radius: 0.75rem;
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    .qr-container img { display: block; width: 180px; height: 180px; }
    .btn {
      display: block;
      width: 100%;
      padding: 0.85rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      margin-bottom: 0.75rem;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-upi { background: var(--accent); color: #fff; }
    .btn-copy { background: #334155; color: var(--text-main); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Birthday Wishlist</div>
    <h1>Buy Me Birthday Coffee! ☕</h1>
    <p>Contributing towards the official celebration fund.</p>
    
    <div class="amount-pill">₹2,000</div>

    <div class="qr-container">
      <img id="qr-img" alt="Scan with any UPI App" src="" />
    </div>

    <a id="upi-link" class="btn btn-upi" href="#">Pay ₹2,000 via UPI App</a>
    <button id="copy-btn" class="btn btn-copy" onclick="copyUPI()">Copy UPI ID</button>
  </div>

  <script>
    // Configuration
    const UPI_ID = "8989190963@fam"; // Replace with recipient VPA
    const PAYEE_NAME = "Birthday Guy"; // Replace with legal/display name
    const AMOUNT = "2000.00";
    const NOTE = "Happy Birthday Gift";

    // Build standard NPCI UPI URI
    const upiUri = `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(PAYEE_NAME)}&am=${AMOUNT}&cu=INR&tn=${encodeURIComponent(NOTE)}`;

    // Set interactive targets
    document.getElementById("upi-link").setAttribute("href", upiUri);
    const qrEndpoint = `https://quickchart.io/qr?text=${encodeURI(upiUri)}&size=200&centerImageUrl=https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg`;
    document.getElementById("qr-img").src = qrEndpoint;

    // Trigger celebration effects
    window.addEventListener("load", () => {
      confetti({
        particleCount: 80,
        spread: 60,
        origin: { y: 0.6 }
      });
    });

    function copyUPI() {
      navigator.clipboard.writeText(UPI_ID).then(() => {
        const btn = document.getElementById("copy-btn");
        btn.textContent = "UPI ID Copied!";
        setTimeout(() => { btn.textContent = "Copy UPI ID"; }, 2000);
      });
    }
  </script>
</body>
</html>
